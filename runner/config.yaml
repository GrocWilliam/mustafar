# act_runner settings; unset keys keep act_runner's defaults.
runner:
  capacity: 8 # each commit runs 7 jobs (test, then 6 acceptance shards): below 6 × MAX_AGENTS, parallel stories queue for CI
  labels:
    - "ubuntu-latest:docker://forge-ci" # built locally (ci/Dockerfile): the same toolchain as the agents
container:
  force_pull: false # forge-ci exists only on this host: pulling it would fail
  # Job containers join the compose network to reach http://gitea:3000.
  network: forge
  # "-" = never mount the Docker socket into jobs: CI runs agent-written code, which must not get root on the host.
  docker_host: "-"
  # Outgoing connections take ports from 40000 up, so a test server on a lower port never clashes with its own
  # /health checks (EADDRINUSE).
  options: --sysctl net.ipv4.ip_local_port_range="40000 60999"
