# Copy to `.gitea/workflows/ci.yml` in the target repo. Agents cannot change it: `.gitea/` is a protected path.
name: ci
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
  # Run from here, not from the dev's Makefile, so the dev cannot drop them from CI; in a job of its own, from a fresh
  # checkout, so `make test` cannot rewrite them on disk before they run.
  acceptance:
    # No spaces: the job name becomes the container's network alias, and Podman's aardvark-dns stops on one with a space.
    name: acceptance-${{ matrix.shard }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2] # scripts split round-robin across 3 parallel jobs; also in the loop below
    steps:
      - uses: actions/checkout@v4
      - name: acceptance tests (frozen, written by the tester agent)
        run: |
          # Build once for every script of this shard; scripts skip their own build when FORGE_PREBUILT is set.
          if make -n build >/dev/null 2>&1; then make build; export FORGE_PREBUILT=1; fi
          i=0
          for script in tests/acceptance/*/run.sh; do
            [ -e "$script" ] || continue
            [ $((i++ % 3)) -eq ${{ matrix.shard }} ] || continue
            echo "== $script"
            bash "$script"
          done
