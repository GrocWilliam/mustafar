# Copy to `.gitea/workflows/ci.yml` in the target repo. Agents cannot change it: `.gitea/` is a protected path.
name: ci
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
  # Run from here, not from the dev's Makefile, so the dev cannot drop them from CI; in a job of its own, from a fresh
  # checkout, so `make test` cannot rewrite them on disk before they run.
  acceptance:
    # No spaces: the job name becomes the container's network alias, and Podman's aardvark-dns stops on one with a space.
    name: acceptance-${{ matrix.shard }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5] # scripts split round-robin across 6 parallel jobs; also in the loop below
    steps:
      # Only actions/checkout: the runner shares one copy of each action between jobs, and 6 shards fetching another
      # one at once corrupt it (no artifact actions here for that reason).
      - uses: actions/checkout@v4
      - name: acceptance tests (frozen, written by the tester agent)
        shell: bash
        run: |
          # Every story runs every test, so an earlier test it breaks shows up on that story, where its tester can update it.
          scripts=()
          i=0
          for script in tests/acceptance/*/run.sh; do
            [ -e "$script" ] || continue
            [ $((i++ % 6)) -eq ${{ matrix.shard }} ] || continue
            scripts+=("$script")
          done
          [ ${#scripts[@]} -gt 0 ] || exit 0
          # Build once for every script of this shard; scripts skip their own build when FORGE_PREBUILT is set.
          if make -n build >/dev/null 2>&1; then make build; export FORGE_PREBUILT=1; fi
          # fetch() refuses port 10080 ("bad port"): hold it, so the scripts' random free-port pickers skip it.
          node -e "require('net').createServer().listen(10080)" >/dev/null 2>&1 &
          # One Chromium for the whole shard: the CI image's playwright-core connects to it instead of launching one per
          # script (each script still gets fresh contexts).
          if [ -d /opt/playwright-shared ]; then
            node -e "require('$PLAYWRIGHT_DIR/node_modules/playwright-core').chromium.launchServer({executablePath: process.env.CHROMIUM_PATH}).then((s) => console.log(s.wsEndpoint()))" >/tmp/pw-ws 2>/dev/null &
            for _ in $(seq 60); do [ -s /tmp/pw-ws ] && break; sleep 0.5; done
            [ -s /tmp/pw-ws ] && export PW_WS_ENDPOINT="$(head -1 /tmp/pw-ws)" PLAYWRIGHT_DIR=/opt/playwright-shared
          fi
          # A newer commit on the pull request makes this run's result unread: stop, and free the runner for that one.
          superseded() {
            local head
            head=$(git ls-remote origin "refs/heads/${{ github.head_ref }}" | cut -f1)
            [ -n "$head" ] && [ "$head" != "${{ github.event.pull_request.head.sha }}" ]
          }
          # Run every script even after a failure, so one run reports every broken test, not one per shard.
          failed=()
          for script in "${scripts[@]}"; do
            superseded && { echo "superseded by a newer commit on ${{ github.head_ref }}: stopping"; exit 1; }
            echo "== $script"
            bash "$script" || failed+=("$script")
          done
          [ ${#failed[@]} -eq 0 ] || { printf 'FAILED: %s\n' "${failed[@]}"; exit 1; }
